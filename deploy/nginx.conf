# nginx site for the ASPR website and its admin on an Ubuntu VPS. See DEPLOY.md, step 7.
#
# One Node process (server.js, run by PM2) serves the website and the admin on 127.0.0.1:3000.
# The API listens privately on 127.0.0.1:4000 and is reached through the website's /api proxy,
# so nginx only talks to port 3000.
#
# Security headers (per-request nonce CSP, HSTS, X-Frame-Options, nosniff, Referrer-Policy,
# Permissions-Policy) are set by the app (frontend/middleware.ts, backend/src/main.ts), so they
# are not repeated here. certbot adds the certificates and the HTTP -> HTTPS redirects.

upstream aspr_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.asprglobaltech.com;
    return 301 https://asprglobaltech.com$request_uri;
}

# Public website
server {
    listen 80;
    listen [::]:80;
    server_name asprglobaltech.com;
    server_tokens off;

    # Quote/contact/job forms accept 5 files of 10 MB; admin video uploads up to 60 MB.
    client_max_body_size 70m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    # Brotli needs the ngx_brotli module (apt install libnginx-mod-http-brotli-filter). Then uncomment:
    # brotli on; brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed build assets never change: cache for a year.
    location /_next/static/ {
        include snippets/aspr-proxy.conf;
        proxy_pass http://aspr_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Images under public/assets keep their filenames when replaced, so a week, not a year.
    location /assets/ {
        include snippets/aspr-proxy.conf;
        proxy_pass http://aspr_app;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    # The chat assistant streams answers (Server-Sent Events); don't buffer them.
    location /api/chat/ {
        include snippets/aspr-proxy.conf;
        proxy_pass http://aspr_app;
        proxy_buffering off;
        proxy_cache off;
    }

    # The admin is served on admin.asprglobaltech.com (reset-password email links land here and follow).
    location /admin {
        return 301 https://admin.asprglobaltech.com$request_uri;
    }

    location / {
        include snippets/aspr-proxy.conf;
        proxy_pass http://aspr_app;
    }
}

# Admin: the same app; the __Host- session cookie is bound to this host.
server {
    listen 80;
    listen [::]:80;
    server_name admin.asprglobaltech.com;
    server_tokens off;
    client_max_body_size 70m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /admin;
    }

    location /_next/static/ {
        include snippets/aspr-proxy.conf;
        proxy_pass http://aspr_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # /admin pages, /api and /assets.
    location / {
        include snippets/aspr-proxy.conf;
        proxy_pass http://aspr_app;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

