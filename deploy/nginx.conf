# nginx site for a Hostinger VPS. Copy to /etc/nginx/sites-available/aspr, symlink into
# sites-enabled, then `sudo certbot --nginx -d asprglobaltech.com -d www.asprglobaltech.com`.
server {
    listen 80;
    server_name asprglobaltech.com www.asprglobaltech.com;

    # Briefs and applications accept up to 10 files of 10 MB each.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # The chat assistant streams answers (Server-Sent Events); don't buffer them.
    location /api/chat/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
